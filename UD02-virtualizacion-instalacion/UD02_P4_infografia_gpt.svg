<text x="104" y="595" fill="#2E7D4F" font-size="21" font-weight="bold">La solución: sudo parted -l → Fix</text>
<text x="104" y="618" fill="#5B6472" font-size="15">parted mueve la copia de la GPT al nuevo final. No toca ninguna partición ni ningún dato.</text>
