<text x="60" y="50" fill="#FFFFFF" font-size="30" font-weight="bold">Práctica 4 · Por qué falla la instalación de Ubuntu</text>
<text x="60" y="84" fill="#DDE3F0" font-size="18">«partitioning crashed with CurtinInstallError»: la copia de la tabla GPT se queda fuera de sitio al ampliar el disco</text>
